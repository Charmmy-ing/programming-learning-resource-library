<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编程学习资源库 · Programmer Learning Hub</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header>
  <h1>编程学习资源库</h1>
  <p class="slogan">精选学习资源 · 在线预览 · 一键下载 · 完全免费开放</p>
</header>
<nav>
  <a href="#lang">自学分区</a>
  <a href="#tools">编辑必备工具</a>
  <a href="#resource">自学宝藏网站</a>
  <a href="#disclaimer">使用声明</a>
</nav>
<div class="search-wrap">
  <input id="site-search" type="text" placeholder="🔍 搜资源、搜网站，比如：JVM / 数据结构 / LeetCode" autocomplete="off">
  <span id="search-count" class="search-count"></span>
</div>
<main>
  <div id="search-empty" class="search-empty" style="display:none">没有找到相关内容，换个关键词试试～</div>
  <section id="lang">
    <h2>💻 自学分区</h2>
    <div class="lang-grid" id="lang-cards"></div>
  </section>
  <section id="method">
    <h2>📘 学习方法</h2>
    <div class="cards" id="method-cards"></div>
  </section>
  <section id="tools">
    <h2>🛠️ 编辑必备工具</h2>
    <div class="cards" id="tools-cards"></div>
  </section>
  <section id="resource">
    <h2>🌐 自学宝藏网站</h2>
    <div id="resource-groups"></div>
  </section>
  <section id="disclaimer">
    <h2>📢 使用声明</h2>
    <div class="card" id="disclaimer-content"></div>
  </section>
</main>
<footer>
  <p>本站资源仅供学习交流使用 · 禁止商用倒卖 · 由热爱编程的在校学生维护</p>
</footer>
<button id="back-top" class="back-top" title="回到顶部" aria-label="回到顶部">↑</button>
<script src="assets/js/main.js"></script>
</body>
</html>
